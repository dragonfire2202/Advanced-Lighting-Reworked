advance-lighting = Advance Lighting

setting.al-bloom-enabled.name = Enable Bloom
setting.al-bloom-enabled.description = May conflict with vanilla bloom, disabling it is recommended.
setting.al-environment-enabled.name = Render Environment
setting.al-environment-enabled.description = Requires Restart.

setting.al-bloom-quality.name = Bloom Quality
setting.al-bloom-intensity.name = Bloom Intensity
setting.al-bloom-blur-amount.name = Blur Amount
setting.al-bloom-flare-amount.name = Flare Amount
setting.al-bloom-flare-length.name = Flare Length
setting.al-bloom-threshold.name = Bloom Threshold
setting.al-bloom-saturation.name = Bloom Saturation
setting.al-bloom-flare-direction.name = Flare Direction
setting.al-bloom-blur-size.name = Blur Size

setting.al-bloom-blur-feedback.name = Blur Feedback
setting.al-bloom-blur-feedback.description = How much the blur brighten each iteration, only works when Blur Amount is greater than 1.

setting.al-bloom-flare-feedback.name = Flare Feedback
setting.al-bloom-flare-feedback.description = How much the flare brighten each iteration, only works when Flare Amount is greater than 1.

setting.al-bloom-diffuse-amount.name = Blur Diffuse Amount
setting.al-bloom-diffuse-amount.description = Amount of extra blur with increasing sizes added on top.

setting.al-bloom-diffuse-size.name = Blur Diffuse Size
setting.al-bloom-diffuse-feedback.name = Blur Diffuse Feedback

setting.al-hide-lights.name = Disable Lights
setting.al-hide-lights.description = Disables Vanilla Lights.
setting.al-light-enabled.name = Enable Light Map
setting.al-light-enabled.description = Glowing things (blocks, lasers, bullets, molten liquids) softly light up the blocks around them. Cheap: works on a small blurred texture.
setting.al-light-night.name = Light Map Night Lighting
setting.al-light-night.description = Replaces vanilla night lighting: darkness is lifted around anything that glows. Disables vanilla light circles. Only affects maps with lighting enabled.
setting.al-light-radius.name = Light Radius
setting.al-light-intensity.name = Light Intensity
setting.al-light-tint.name = Light Tint
setting.al-light-tint.description = How strongly the light adds colored glow onto nearby blocks.
setting.al-light-radius.description = How far the light spreads. Measured in world units, so it does not change when zooming.
setting.al-light-vanilla.name = Block Lights In Light Map
setting.al-light-vanilla.description = Lights of vanilla blocks (lamps, reactors, turrets and so on) light their surroundings through the light map instead of being turned off. Used with night lighting.
setting.al-light-res.name = Light Map Resolution
setting.al-light-res.description = Light map resolution relative to the screen. Higher is smoother and keeps thin lights (lasers) visible when zoomed out, lower is faster.
setting.al-light-blur.name = Light Map Blur
setting.al-light-blur.description = Smooths the finished light map. Hides the pixelated look of low resolutions, and is cheap.
