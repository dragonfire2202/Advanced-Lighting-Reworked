advance-lighting = Advance Lighting

setting.al-bloom-enabled.name = Включить Свечение
setting.al-bloom-enabled.description = Может конфликтовать с ванильным свечением, рекомендуется отключить его.
setting.al-environment-enabled.name = Рендеринг Окружения
setting.al-environment-enabled.description = Требует Перезагрузки.

setting.al-bloom-quality.name = Качество Свечения
setting.al-bloom-intensity.name = Интенсивность Свечения
setting.al-bloom-blur-amount.name = Степень Размытия
setting.al-bloom-flare-amount.name = Количество Вспышек
setting.al-bloom-flare-length.name = Длина Вспышки
setting.al-bloom-threshold.name = Порог Свечения
setting.al-bloom-saturation.name = Насыщенность Свечения
setting.al-bloom-flare-direction.name = Направление Вспышки
setting.al-bloom-blur-size.name = Размер Размытия

setting.al-bloom-blur-feedback.name = Обратная связь Размытия
setting.al-bloom-blur-feedback.description = Насколько размытие осветляет каждую итерацию, работает только в том случае, если параметр "Степень Размытия" больше 1.

setting.al-bloom-flare-feedback.name = Обратная связь Вспышки
setting.al-bloom-flare-feedback.description = Насколько ярче блики на каждой последующей итерации, работает только при параметре "Количество Вспышек" больше 1.

setting.al-bloom-diffuse-amount.name = Количество Диффузного размытия
setting.al-bloom-diffuse-amount.description = Количество дополнительного размытия которое будет добавлено сверху с увеличением размера.

setting.al-bloom-diffuse-size.name = Размер Диффузного размытия
setting.al-bloom-diffuse-feedback.name = Обратная связь Диффузного Размытия

setting.al-hide-lights.name = Отключить освещение
setting.al-hide-lights.description = Отключает ванильное освещение.
setting.al-light-enabled.name = Включить карту света
setting.al-light-enabled.description = Светящиеся объекты (блоки, лазеры, снаряды, раскалённые жидкости) мягко подсвечивают блоки вокруг. Работает быстро: использует маленькую размытую текстуру.
setting.al-light-night.name = Ночное освещение по карте света
setting.al-light-night.description = Заменяет ванильное ночное освещение: темнота рассеивается вокруг всего, что светится. Отключает ванильные круги света. Действует только на картах с включённым освещением.
setting.al-light-radius.name = Радиус света
setting.al-light-intensity.name = Яркость света
setting.al-light-tint.name = Цветная подсветка
setting.al-light-tint.description = Насколько сильно свет добавляет цветное свечение соседним блокам.
setting.al-light-radius.description = Как далеко распространяется свет. Считается в мировых единицах, поэтому не меняется при приближении камеры.
setting.al-light-vanilla.name = Свет от блоков в карте света
setting.al-light-vanilla.description = Свет ванильных блоков (лампы, реакторы, турели и т. д.) освещает окружение через карту света, а не отключается. Работает вместе с ночным освещением.
setting.al-light-res.name = Разрешение карты света
setting.al-light-res.description = Разрешение карты света относительно экрана. Выше: плавнее, и тонкие источники света (лазеры) не пропадают при отдалении. Ниже: быстрее.
setting.al-light-blur.name = Размытие карты света
setting.al-light-blur.description = Сглаживает готовую карту света. Убирает пикселизацию на низких разрешениях и почти ничего не стоит.
