# Mindustry release tag to compile against, e.g. `v160.5`. The game jar is downloaded from
# https://github.com/Anuken/Mindustry/releases (asset `Mindustry.jar`), so the tag must exist there.
mindustryVersion = v160.5

# Android SDK configuration, only needed for the `dex` task (Android-compatible jar).
# Install with: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
androidSdkVersion = 37.0
androidBuildVersion = 37.0.0
androidMinVersion = 21

org.gradle.parallel = true
